<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4a044e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#portGrad)" />
  
  <!-- Browser Window Mockup -->
  <rect x="75" y="45" width="450" height="260" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- Browser Top Bar -->
  <path d="M75 57 C75 50, 80 45, 87 45 H513 C520 45, 525 50, 525 57 V80 H75 Z" fill="#0f172a" />
  <circle cx="100" cy="62" r="5" fill="#ef4444" />
  <circle cx="118" cy="62" r="5" fill="#f59e0b" />
  <circle cx="136" cy="62" r="5" fill="#10b981" />
  
  <!-- Search/URL Bar -->
  <rect x="160" y="52" width="280" height="20" rx="6" fill="#1e293b" />
  <text x="240" y="66" font-family="sans-serif" font-size="11" fill="#94a3b8">https://shaik-arshiya.dev</text>
  
  <!-- Hero Preview Mockup Inside Browser -->
  <rect x="105" y="105" width="160" height="18" rx="4" fill="url(#accentGrad)" />
  <rect x="105" y="135" width="220" height="10" rx="3" fill="#64748b" opacity="0.6" />
  <rect x="105" y="153" width="180" height="10" rx="3" fill="#64748b" opacity="0.4" />
  
  <!-- Badges -->
  <rect x="105" y="180" width="70" height="24" rx="12" fill="#3b82f6" opacity="0.8" />
  <text x="140" y="196" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">HTML5</text>
  
  <rect x="185" y="180" width="60" height="24" rx="12" fill="#8b5cf6" opacity="0.8" />
  <text x="215" y="196" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">CSS3</text>
  
  <rect x="255" y="180" width="50" height="24" rx="12" fill="#ec4899" opacity="0.8" />
  <text x="280" y="196" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">JS</text>
  
  <!-- Glowing Graphic on Right -->
  <circle cx="430" cy="180" r="55" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-dasharray="8 6" />
  <circle cx="430" cy="180" r="40" fill="#6366f1" opacity="0.25" />
  <text x="430" y="190" font-family="'Plus Jakarta Sans', sans-serif" font-size="32" fill="#ec4899" text-anchor="middle">⚡</text>
</svg>
