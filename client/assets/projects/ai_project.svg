<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <rect width="600" height="350" rx="16" fill="url(#aiGrad)" />
  
  <!-- Neural Network Connections -->
  <g stroke="#059669" stroke-width="2" opacity="0.4">
    <line x1="100" y1="100" x2="220" y2="80" />
    <line x1="100" y1="100" x2="220" y2="160" />
    <line x1="100" y1="180" x2="220" y2="80" />
    <line x1="100" y1="180" x2="220" y2="160" />
    <line x1="100" y1="180" x2="220" y2="240" />
    <line x1="100" y1="260" x2="220" y2="160" />
    <line x1="100" y1="260" x2="220" y2="240" />
    
    <line x1="220" y1="80" x2="360" y2="120" />
    <line x1="220" y1="160" x2="360" y2="120" />
    <line x1="220" y1="160" x2="360" y2="200" />
    <line x1="220" y1="240" x2="360" y2="200" />
    
    <line x1="360" y1="120" x2="480" y2="160" />
    <line x1="360" y1="200" x2="480" y2="160" />
  </g>
  
  <!-- Neural Nodes -->
  <circle cx="100" cy="100" r="12" fill="#10b981" />
  <circle cx="100" cy="180" r="12" fill="#10b981" />
  <circle cx="100" cy="260" r="12" fill="#10b981" />
  
  <circle cx="220" cy="80" r="14" fill="#06b6d4" />
  <circle cx="220" cy="160" r="14" fill="#06b6d4" />
  <circle cx="220" cy="240" r="14" fill="#06b6d4" />
  
  <circle cx="360" cy="120" r="15" fill="#3b82f6" />
  <circle cx="360" cy="200" r="15" fill="#3b82f6" />
  
  <circle cx="480" cy="160" r="18" fill="url(#neonCyan)" />
  <text x="480" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#022c22" text-anchor="middle">y^</text>
  
  <text x="300" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" fill="#34d399" text-anchor="middle">AI &amp; Machine Learning Specialization</text>
</svg>
