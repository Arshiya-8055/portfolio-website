<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Glow Ring -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="10 8" opacity="0.6" />
  
  <!-- Main Orb -->
  <circle cx="150" cy="150" r="120" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Modern Tech Developer Silhouette / Geometric Portrait -->
  <circle cx="150" cy="115" r="44" fill="#fdf2f8" opacity="0.95" />
  
  <!-- Hair / Hijab Accent Styling -->
  <path d="M102 125 C102 75, 198 75, 198 125 C198 165, 185 180, 150 180 C115 180, 102 165, 102 125 Z" fill="#1e1b4b" opacity="0.88" />
  <circle cx="150" cy="120" r="38" fill="#fed7aa" />
  
  <!-- Friendly Tech Features -->
  <ellipse cx="138" cy="118" rx="3.5" ry="4.5" fill="#312e81" />
  <ellipse cx="162" cy="118" rx="3.5" ry="4.5" fill="#312e81" />
  <path d="M142 133 Q150 140 158 133" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" fill="none" />
  
  <!-- Torso / Tech Hoodie -->
  <path d="M85 240 C85 185, 215 185, 215 240 Z" fill="#312e81" />
  <path d="M125 195 L150 225 L175 195" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" />
  
  <!-- Floating Code Badges -->
  <g transform="translate(45, 140)">
    <rect width="52" height="26" rx="13" fill="#0f172a" opacity="0.85" stroke="#38bdf8" stroke-width="1.5" />
    <text x="26" y="17" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <g transform="translate(205, 110)">
    <rect width="52" height="26" rx="13" fill="#0f172a" opacity="0.85" stroke="#f43f5e" stroke-width="1.5" />
    <text x="26" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">AI•ML</text>
  </g>
  <g transform="translate(195, 205)">
    <circle cx="18" cy="18" r="18" fill="#0f172a" opacity="0.85" stroke="#10b981" stroke-width="1.5" />
    <text x="18" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#10b981" text-anchor="middle">✨</text>
  </g>
</svg>
